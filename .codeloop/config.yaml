gates:
  mode: all
capacity:
  gates_per_day: 8
agents:
  default: claude
  cursor:
    cmd: "agent -p --force --output-format text \"$(cat {brief})\""
    timeout_minutes: 20
    max_runs_per_day: 40
  claude-sonnet:
    cmd: "claude -p --model sonnet --permission-mode acceptEdits < {brief}"
    timeout_minutes: 30
    max_runs_per_day: 50
  claude:
    cmd: "claude -p --permission-mode acceptEdits < {brief}"
    timeout_minutes: 10
    max_runs_per_day: 50

git:
  trunk: feat/cli-lanes-gates-agent-runs
