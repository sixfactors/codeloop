gates:
  mode: all
capacity:
  gates_per_day: 8
agents:
  default: claude
  cursor:
    cmd: "agent -p --force --output-format text \"$(cat {brief})\""
    timeout_minutes: 20
    max_runs_per_day: 40
  claude-sonnet:
    cmd: "claude -p --model sonnet --permission-mode acceptEdits < {brief}"
    timeout_minutes: 30
    max_runs_per_day: 50
  claude:
    cmd: "claude -p --permission-mode acceptEdits < {brief}"
    timeout_minutes: 40
    max_runs_per_day: 50

git:
  trunk: main

# In-app mocks: the workspace is a Next.js app whose pages live under workspace/app.
mock:
  target: app
  app_dir: workspace/app
  components: components/shared

# The review pass runs in each doctor tick: it places and closes stories from their merged work.
doctor:
  review: on
