# Written by `codeloop init --ci github`. Does nothing until deploy.staging.command is set in .codeloop/config.yaml.
name: codeloop staging
on:
  push:
    branches: [main]

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build --if-present
      - name: Deploy to staging
        id: deploy
        run: |
          cmd=$(npx --yes @sixfactors-ai/codeloop config get deploy.staging.command)
          if [ -z "$cmd" ]; then
            echo "deploy.staging.command is not set; nothing to deploy"
            exit 0
          fi
          sh -c "$cmd"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify the shipped cards against staging
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for id in $(git log --format='%(trailers:key=Feature,valueonly)' "${{ github.event.before }}..${{ github.sha }}" | sort -u); do
            npx --yes @sixfactors-ai/codeloop verify "$id" --env staging --no-record
          done
