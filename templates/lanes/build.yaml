id: build
version: 3
metric: { name: cycle_time_days, source: cards, target: "<5" }
trigger: { manual: true }
wip: 2
retries: 3
# A stage with `when: size >= S` is skipped for a card sized trivial, so it enters at build.
stages:
  - id: research
    when: "size >= S"
    skill: research
    output: "{spec}/research.md"
    done: { cmd: "codeloop check research {id} --min-sources 3 && codeloop check wiki-landed {id} --stage research && codeloop check rubric {id}" }
    # A second agent judges R6 (and re-reads the attested rows) before the check, writing
    # {spec}/review-research.md. Off by default: it doubles the agent runs for the stage, and needs a
    # `reviewer` preset under agents: in .codeloop/config.yaml.
    # review: { agent: reviewer }
  # The agent asks before it designs: up to five questions with a recommended answer each, answered
  # from the inbox or the board. The stage waits until every question has an answer.
  - id: interview
    when: "size >= S"
    skill: interview
    output: "{spec}/interview.md"
    done: { cmd: "codeloop check questions {id} --min 3 && codeloop check rubric {id}" }
    # A second agent judges I3 and I5 before the check, writing {spec}/review-interview.md. Off by
    # default for the same reason as research.
    # review: { agent: reviewer }
  # Optional per card: a card with nothing to draw writes `screens: none` in its spec and passes without a mock.
  - id: mock
    when: "size >= S"
    skill: mock
    done: { cmd: "codeloop check mock {id} && codeloop check rubric {id}" }
    notes:
      - "Name each screen under `screens:` in the card's spec.md, run `codeloop mock new <card> --topic <topic>`, and draw one frame per screen state in the file it creates."
  - id: spec
    when: "size >= S"
    skill: spec
    output: "{spec}/tasks.md"
    done: { cmd: "codeloop spec check {id} && codeloop check rubric {id}" }
    gate: { name: spec, approver: owner }
  # Passes with no work when no task is tagged `[data]` and spec.md names no `entities:`.
  - id: data-model
    skill: system-design
    output: "{spec}/data-model.md"
    done: { cmd: "codeloop check data-model {id} && codeloop check rubric {id}" }
    notes:
      - "skip_when: no data tasks. The check passes trivially when no task is tagged `[data]` and spec.md has no `entities:` list."
      - "Otherwise read .codeloop/wiki/architecture/data-model.md first and write {spec}/data-model.md with ## Entities, ## Stores, ## Indexes and ## Migration. Every store must already be on the architecture page, or be added there in this story."
  - id: build
    skill: api
    done: { cmd: "codeloop task check {id} --all-done && npm test && codeloop check rubric {id}" }
    notes:
      - "Work the tasks in layer order: [api] with the api skill, [sdk] with the sdk skill, [ui] with the ui skill. Tick each task line as it is done."
  - id: verify
    skill: verify
    output: evidence/{nnn}/verify.md
    done: { cmd: "codeloop verify {id} && codeloop check rubric {id}" }
    notes:
      - "One use case per acceptance line, in usecases/{nnn}/uc-{nnn}-NN.yaml: id, accept (US1..), failure_mode, layers.cli.run and expect."
      - "codeloop verify rewrites only its marked block in evidence/{nnn}/verify.md; add your own runs and tables outside it." 
    gate: { name: local, approver: owner }
  # Review is a triage: every finding gets a verdict (fix now, defer, unnecessary) and evidence; deferred findings become proposals.
  # Every changed file outside the story's plan also gets a keep / revert / move verdict in a `## Scope` table.
  - id: review
    skill: review
    output: evidence/{nnn}/review.md
    done: { cmd: "codeloop check file evidence/{nnn}/review.md --has 'verdict: approve' && codeloop check scope {id} && codeloop check wiki-landed {id} --stage review && codeloop check rubric {id}" }
    gate: { name: pr, approver: reviewer }
  - id: staging
    skill: release
    output: evidence/{nnn}/staging.md
    done: { cmd: "codeloop check file evidence/{nnn}/staging.md --has 'result: pass' && codeloop check rubric {id}" }
  - id: live
    skill: release
    output: evidence/{nnn}/prod.md
    done: { cmd: "codeloop check file evidence/{nnn}/prod.md --has 'result: pass' && codeloop check rubric {id}" }
    gate: { name: prod, approver: owner, outward: true }
# on_done starts the next lane's card when one here finishes. It is off until config.yaml has
# `lanes: { auto_start: true }`; until then a finished card only announces what it would start.
# on_done: { start: market }
